name: superset-dev

x-superset-common: &superset-common
  image: hospital-superset:6.1.0-p1
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  environment: &superset-env
    SUPERSET_CONFIG_PATH: /app/superset_config.py
    FLASK_APP: superset
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  volumes:
    - ./superset_config.py:/app/superset_config.py:ro
    - ./superset_home:/app/superset_home
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    container_name: superset-dev-postgres
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: superset
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: superset-dev-redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  superset-init:
    <<: *superset-common
    container_name: superset-dev-init
    command:
      - bash
      - -c
      - "superset db upgrade && (superset fab create-admin --username admin --firstname Admin --lastname Dev --email admin@dev.local --password ${ADMIN_INIT_PASSWORD} || echo '[init] admin exists') && superset init"
    restart: "no"

  superset-web:
    <<: *superset-common
    container_name: superset-dev-web
    command: ["superset", "run", "--host", "0.0.0.0", "--port", "8088", "--with-threads", "--debug"]
    ports:
      - "127.0.0.1:8088:8088"
    restart: unless-stopped
