name: superset-prod

x-superset-common: &superset-common
  image: hospital-superset:6.1.0-p2
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  environment: &superset-env
    SUPERSET_CONFIG_PATH: /app/superset_config.py
    FLASK_APP: superset
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  volumes:
    - /home/superset/superset_config.py:/app/superset_config.py:ro
    - /home/superset/superset_home:/app/superset_home
    - /home/superset/translations_zh/messages.mo:/app/superset/translations/zh/LC_MESSAGES/messages.mo:ro
    - /home/superset/patches/oracle.py:/app/superset/db_engine_specs/oracle.py:ro
    - /home/superset/patches/core.py:/app/superset/models/core.py:ro
    - /home/superset/translations_zh/messages.json:/app/superset/translations/zh/LC_MESSAGES/messages.json:ro
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    container_name: superset-postgres
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: superset
    volumes:
      - /home/superset/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 4g
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: superset-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /home/superset/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    restart: unless-stopped

  superset-init:
    <<: *superset-common
    container_name: superset-init
    command:
      - bash
      - -c
      - "superset db upgrade && (superset fab create-admin --username admin --firstname Admin --lastname Hospital --email admin@hospital.local --password ${ADMIN_INIT_PASSWORD} || echo '[init] admin exists') && superset init"
    restart: "no"

  superset-web:
    <<: *superset-common
    container_name: superset-web
    command:
      ["gunicorn", "-w", "4", "-k", "gthread", "--threads", "8", "-b", "0.0.0.0:8088",
       "--timeout", "120", "--graceful-timeout", "60",
       "--limit-request-line", "0", "--limit-request-field_size", "0",
       "superset.app:create_app()"]
    mem_limit: 6g
    restart: unless-stopped

  superset-worker:
    <<: *superset-common
    container_name: superset-worker
    command: celery --app=superset.tasks.celery_app:app worker -Ofair --concurrency=2
    shm_size: 512m
    mem_limit: 6g
    healthcheck:
      disable: true
    restart: unless-stopped

  superset-beat:
    <<: *superset-common
    container_name: superset-beat
    command: celery --app=superset.tasks.celery_app:app beat -s /tmp/celerybeat-schedule
    mem_limit: 1g
    healthcheck:
      disable: true
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: superset-nginx
    depends_on: [superset-web]
    ports:
      - "8180:80"
    volumes:
      - /home/superset/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/superset/custom:/usr/share/custom:ro
    mem_limit: 256m
    restart: unless-stopped
