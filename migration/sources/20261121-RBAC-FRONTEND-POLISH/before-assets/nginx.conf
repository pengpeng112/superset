# 使用上游本次响应的 CSP nonce 注入医院界面脚本。
map $upstream_http_content_security_policy $hospital_script_nonce {
    default "";
    "~'nonce-(?<hospital_csp_nonce>[^']+)'" $hospital_csp_nonce;
}

# 旧 Chromium 使用相同发行版的语法兼容资源；新版继续读取上游原资源。
map $http_user_agent $hospital_legacy_asset {
    default 0;
    ~Chrom(e|ium)/8[0-8]\. 1;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # 医院定制静态资源（logo / 登录页品牌脚本 / 中文语言包）
    location /custom/ {
        alias /usr/share/custom/;
        # 定制资源路径稳定；每次导航校验版本，升级后不要求用户手动清缓存。
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Vary User-Agent always;
    }

    # 登录页也要能取到中文包。原接口要求已登录，未登录时前端会退回英文。
    # exact location 直接 alias 到文件时，带结尾斜杠会 500，所以先改写到不带斜杠的地址。
    location = /superset/language_pack/zh/ {
        rewrite ^ /superset/language_pack/zh last;
    }

    location = /superset/language_pack/zh {
        alias /usr/share/custom/messages.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location / {
        if ($hospital_legacy_asset) {
            rewrite ^/static/assets/([^/]+\.js)$ /custom/chrome80-assets/$1 last;
        }
        proxy_pass http://superset-web:8088;
        proxy_read_timeout 300;
        # 保留 :8180（以及本地转发端口），避免登录 next 回跳丢端口误入宿主网站。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # sub_filter 需要上游返回未压缩内容
        proxy_set_header Accept-Encoding "";
        # 上游 HTML 已 no-store；保留其响应缓存策略。
        add_header Vary User-Agent always;
        sub_filter '<head>' '<head><script nonce="$hospital_script_nonce" src="/custom/browser-polyfills.js?v=20261009a"></script><script nonce="$hospital_script_nonce" src="/custom/app-recovery.js?v=20261022b"></script><script nonce="$hospital_script_nonce" src="/custom/browser-compat.js?v=20261009b"></script><script nonce="$hospital_script_nonce" src="/custom/roles-zh.js?v=20261009d"></script>';
        sub_filter '</head>' '<link rel="stylesheet" href="/custom/vendor/flatpickr-4.6.13/flatpickr.min.css"><link rel="stylesheet" href="/custom/vendor/flatpickr-4.6.13/monthSelect.css"><script nonce="$hospital_script_nonce" src="/custom/vendor/flatpickr-4.6.13/flatpickr.min.js" defer></script><script nonce="$hospital_script_nonce" src="/custom/vendor/flatpickr-4.6.13/zh.js" defer></script><script nonce="$hospital_script_nonce" src="/custom/vendor/flatpickr-4.6.13/monthSelect.js" defer></script><script nonce="$hospital_script_nonce" src="/custom/report-dates.js?v=20261119d19" defer></script><script nonce="$hospital_script_nonce" src="/custom/date-range-zh.js?v=20261015d4" defer></script><script nonce="$hospital_script_nonce" src="/custom/brand.js?v=20261025g" defer></script><script nonce="$hospital_script_nonce" src="/custom/report-ui.js?v=20261119f15" defer></script><script nonce="$hospital_script_nonce" src="/custom/home-ui.js?v=20261119h17" defer></script><script nonce="$hospital_script_nonce" src="/custom/monthly-report.js?v=20261022m12" defer></script><script nonce="$hospital_script_nonce" src="/custom/report-guards.js?v=20261115g6" defer></script></head>';
        sub_filter_once on;
    }
}
